<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Scripts | ScriptsForExe.net</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/explore.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container navbar">
        <a class="brand" href="/index.html" aria-label="ScriptsForExe.net home">
          <div class="brand-mark"><img src="/assets/logo.svg" alt="" aria-hidden="true" /></div>
          <span>ScriptsForExe.net</span>
        </a>
        <nav class="nav-links">
          <a href="/index.html">Home</a>
          <a href="/explore.html">Explore Scripts</a>
          <a href="/login.html">Login</a>
        </nav>
        <div class="nav-actions">
          <a href="/login.html" class="btn primary">Upload Script</a>
        </div>
      </div>
    </header>

    <main class="container page-shell">
      <section class="explore-hero card">
        <div>
          <div class="kicker">Public gallery</div>
          <h1>Explore the best Lua scripts.</h1>
        </div>
        <div class="search-box">
          <input id="explore-search" type="text" placeholder="Search by title, tag, or creator" />
        </div>
      </section>

      <section class="filter-row">
        <div class="chip-group">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="popular">Popular</button>
          <button class="chip" data-filter="recent">Recently uploaded</button>
          <button class="chip" data-filter="downloads">Most downloaded</button>
        </div>
      </section>

      <section class="results-grid" id="explore-results"></section>
    </main>

    <script src="/js/global.js"></script>
    <script src="/js/explore.js"></script>
  </body>
</html>
