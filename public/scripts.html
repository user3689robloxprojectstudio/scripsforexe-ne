<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Scripts | ScriptsForExe.net</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/scripts.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar card">
        <a class="sidebar-brand" href="/index.html" aria-label="ScriptsForExe.net home">
          <div class="brand-mark"><img src="/assets/logo.svg" alt="" aria-hidden="true" /></div>
          <span>ScriptsForExe.net</span>
        </a>
        <nav class="sidebar-nav">
          <a href="/dashboard.html" class="nav-item">Dashboard</a>
          <a href="/scripts.html" class="nav-item active">My Scripts</a>
          <a href="/upload.html" class="nav-item">Upload Script</a>
          <a href="/explore.html" class="nav-item">Explore</a>
          <a href="/settings.html" class="nav-item">Settings</a>
          <button class="nav-item danger" data-logout>Logout</button>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar-panel card">
          <div class="search-wrap">
            <input id="script-search" type="text" placeholder="Search your scripts" />
          </div>
          <a href="/upload.html" class="btn primary">Upload Script</a>
        </header>

        <section class="panel-card card">
          <div class="section-head">
            <h1>My Scripts</h1>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Script</th>
                  <th>Tags</th>
                  <th>Status</th>
                  <th>Updated</th>
                  <th>Downloads</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="scripts-table-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/global.js"></script>
    <script src="/js/scripts.js"></script>
  </body>
</html>
